---
# Your own choices, overriding inventory/group_vars/homelab/main.yml and roles/*/defaults.
# Copy this to config/settings.yml. Not encrypted: there is nothing secret in it.
homelab_bazarr: true
homelab_monitoring: true
homelab_homepage: true
homelab_books: true
homelab_suggestarr: false
homelab_tailscale: true
# A nightly backup of the app data and ebooks to the cloud (README, Offsite backup), e.g.:
# homelab_backup_remote: "gdrive:Backup/homelab"
# The time zone of the apps (default Etc/UTC), e.g.:
# homelab_tz: Europe/Amsterdam
# Subtitle languages (default English), e.g.:
# app_config_bazarr_profile:
#   name: Dutch and English
#   languages: [nl, en]
# An extra quality profile per language, next to the main one (a copy named "HD-1080p - NL"):
# only releases in that language are downloaded. Pick it in Seerr's request dialog or per title
# in Radarr and Sonarr, e.g.:
# app_config_language_profiles:
#   - name: NL
#     languages:
#       - Dutch
# The country Jellyfin uses for ratings and release dates (default US), e.g.:
# app_config_jellyfin_country: NL
# Seerr: discover movies and series in these original languages, and show where they stream:
# app_config_seerr_discover:
#   originalLanguage: "nl|en"
#   streamingRegion: NL
