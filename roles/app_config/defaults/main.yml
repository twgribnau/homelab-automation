---
# Default quality profile in Radarr, Sonarr and Seerr. Recyclarr fills it with TRaSH's profile
# and adds a smaller WEB-only one (templates/recyclarr.yml.j2).
app_config_quality_profile: HD-1080p

# More profiles next to it, one per language you only want to download (language names as Radarr
# and Sonarr list them). Each is a copy of the main profile named "<main> - <name>" that rejects
# every release without that language: nothing is downloaded until one turns up. Pick it in
# Seerr's request dialog or per title in Radarr and Sonarr. The copy is refreshed on every run.
app_config_language_profiles: []
#  - name: NL
#    languages:
#      - Dutch

# https://trash-guides.info/Downloaders/qBittorrent/
app_config_qbittorrent_preferences:
  save_path: /data/torrents
  auto_tmm_enabled: true
  torrent_changed_tmm_enabled: true
  save_path_changed_tmm_enabled: true
  category_changed_tmm_enabled: true
  upnp: false
  # How many torrents run at once; the rest wait in the queue. Fewer at once share the speed
  # among fewer, so each one is done sooner. Torrents without activity don't take a slot.
  max_active_downloads: 5
  max_active_uploads: 5
  max_active_torrents: 10
  dont_count_slow_torrents: true
  # Stop seeding at ratio 2 or after 7 days, whichever comes first. Radarr and Sonarr then
  # remove their stopped torrents; the library copies stay (hardlinks).
  max_ratio_enabled: true
  max_ratio: 2
  max_seeding_time_enabled: true
  max_seeding_time: 10080   # minutes
  max_ratio_act: 0          # 0 = stop the torrent

# Cleanuparr checks the downloads every 5 minutes and gives a strike to each one that is stuck.
# At this many strikes it removes it; Radarr and Sonarr blocklist the release and search again.
# Metadata comes in seconds when anyone shares the torrent, so 3 (15 minutes) is enough.
app_config_cleanuparr_metadata_strikes: 3
# Stalled: no download progress. A strike is dropped again as soon as it progresses.
app_config_cleanuparr_stalled_strikes: 6

# Maintainerr's rule groups, from config/maintainerr.yml (example: config.example/maintainerr.yml,
# which removes what has been watched). None: Maintainerr removes nothing until you make rules.
app_config_maintainerr_rule_groups: []

# What goes to Telegram (when it is set up): imports, imports that need you, errors and
# app updates. Sonarr sends one message per import, so a season pack is one message.
app_config_telegram_events:
  radarr:
    - onDownload
    - onUpgrade
    - onManualInteractionRequired
    - onHealthIssue
    - onHealthRestored
    - onApplicationUpdate
  sonarr:
    - onImportComplete
    - onManualInteractionRequired
    - onHealthIssue
    - onHealthRestored
    - onApplicationUpdate
  prowlarr:
    - onHealthIssue
    - onHealthRestored
    - onApplicationUpdate
# Seerr: new requests and requests it could not send to Radarr/Sonarr (2 + 16 + 128).
app_config_seerr_telegram_types: 146
# Optional: Seerr's defaults for discovering and where something streams, e.g.
#   originalLanguage: "nl|en"
#   streamingRegion: NL
#   discoverRegion: NL
# (config.example/settings.yml).
app_config_seerr_discover: {}

# Bazarr's language profile, the default for every movie and series. Subtitles are searched
# for each language (ISO 639-1 codes). Changing the languages later is done in Bazarr itself.
app_config_bazarr_profile:
  name: English
  languages:
    - en
# Bazarr's subtitle providers that need no account: subtitles already inside the
# video files, subf2m (the Subscene archive) and Gestdown (Addic7ed, series only). Providers you
# enable in Bazarr itself are kept, except the dead ones in app_config_bazarr_providers_dead.
app_config_bazarr_providers:
  - embeddedsubtitles
  - subf2m
  - gestdown
app_config_bazarr_providers_dead:
  - tvsubtitles
  - yifysubtitles
# Plus opensubtitles.com, enabled when the vault has an account.
app_config_opensubtitles_username: "{{ vault_opensubtitles_username | default('') }}"
app_config_opensubtitles_password: "{{ vault_opensubtitles_password | default('') }}"
# Plus SubDL and Subsource (large collections, many languages), each enabled when the vault has its API key.
app_config_subdl_api_key: "{{ vault_subdl_api_key | default('') }}"
app_config_subsource_api_key: "{{ vault_subsource_api_key | default('') }}"

# Homepage's GitHub card (latest release, CI on main, open PRs), shown when the vault has a token.
app_config_github_repo: "{{ homelab_repo | regex_replace('^git@[^:]+:', '') | regex_replace('\\.git$', '') }}"
app_config_github_token: "{{ vault_github_token | default('') }}"

# More links for the Accounts tab on Homepage, e.g. where your VPN login lives (group and icon
# are optional; the group is Other by default):
#   - group: Network
#     name: AirVPN
#     url: "https://airvpn.org"
app_config_accounts: []

# Prowlarr's indexers (the sites it searches), from config/indexers.yml. Indexers you add in
# Prowlarr itself are kept. Example: config.example/indexers.yml
app_config_prowlarr_indexers: []

# Calibre-Web users besides the shared login, from the vault (config.example/vault.yml).
# Created when missing; users you add in Calibre-Web itself are left alone.
app_config_calibre_users: "{{ vault_calibre_users | default([]) }}"

app_config_jellyfin_server_name: Homelab
app_config_jellyfin_language: en
app_config_jellyfin_country: US
# Created when missing. Libraries, users and profiles you add yourself are left alone.
app_config_jellyfin_libraries:
  - name: Movies
    type: movies
    path: /data/media/movies
  - name: Series
    type: tvshows
    path: /data/media/series
# Optional: one home screen for every user, row by row; the rest stays empty. Rows: resume
# (Continue Watching), nextup, latestmedia (Recently Added), librarybuttons (My Media, small),
# smalllibrarytiles, resumeaudio, resumebook, livetv. The web app and the TV apps built on it show
# it; changes made in Jellyfin itself are set back on the next run. Example: config.example/jellyfin.yml
app_config_jellyfin_home: []
# Optional: Custom CSS for Jellyfin's web interface (and the TV apps built on it), e.g. a theme.
# Set on every run; empty leaves what is set in Jellyfin. Example: config.example/jellyfin.yml
app_config_jellyfin_css: ""
# Optional: your login and those users as tiles on Jellyfin's login screen, to pick a profile
# like on Netflix (with a password). Without it they stay hidden, Jellyfin's default.
app_config_jellyfin_profile_tiles: false
# Optional: a profile picture per user, a file in config/ (config.example/jellyfin.yml). Set when
# the user has none yet.
app_config_jellyfin_images: {}
# Plugins by name, from Jellyfin's catalog or the repositories below, installed when missing.
# Intro Skipper finds intros and credits so you can skip them. Jellyfin Enhanced adds features to
# Jellyfin's web interface (press ? in Jellyfin), connected to Seerr so you can request from
# search. With a Simkl app in the vault (vault_simkl_client_id): Simkl, which logs what you
# watch to simkl.com.
app_config_jellyfin_plugins: >-
  {{ ['Intro Skipper', 'Jellyfin Enhanced'] + (['Simkl'] if app_config_simkl_client_id else []) }}
# Jellyfin Enhanced's settings, on top of its defaults. The rest you change in Jellyfin
# (Dashboard, Plugins, Jellyfin Enhanced). Seerr, your TMDb key and the streaming region of
# app_config_seerr_discover (for "Also available on") are added by the playbook.
app_config_jellyfin_enhanced_settings:
  QualityTagsEnabled: true   # 1080p, HDR, codec and audio on the posters
  RatingTagsEnabled: true    # TMDb and Rotten Tomatoes scores on the posters
  ShowAwards: true           # wins and nominations on a title's page
# Plugin repositories besides Jellyfin's own, added when missing.
app_config_jellyfin_repositories:
  - Name: Intro Skipper
    Url: "https://intro-skipper.org/manifest.json"
    Enabled: true
  - Name: Jellyfin Enhanced
    Url: "https://raw.githubusercontent.com/n00bcodr/jellyfin-plugins/main/manifest.json"
    Enabled: true
# More users besides your login, from the vault (config.example/vault.yml): created when
# missing, not admins, with every library and their own watch history. Users you add in
# Jellyfin itself are left alone.
app_config_jellyfin_users: "{{ vault_jellyfin_users | default([]) }}"
# VA-API on the Intel iGPU. HardwareAccelerationType: none = software transcoding.
app_config_jellyfin_encoding:
  HardwareAccelerationType: vaapi
  VaapiDevice: /dev/dri/renderD128
  EnableHardwareEncoding: true
  HardwareDecodingCodecs:
    - h264
    - hevc
    - mpeg2video
    - vc1
    - vp8
    - vp9
  EnableDecodingColorDepth10Hevc: true
  EnableDecodingColorDepth10Vp9: true

# TRaSH blocks 1080p x265 encodes; false keeps them allowed (small files).
app_config_recyclarr_block_x265_hd: false
# Upgrade files until TRaSH's score cutoff (usually to bigger releases).
app_config_recyclarr_upgrades: true
# While x265 is allowed: 720p/1080p minimum size in MB per minute (TRaSH's would reject it).
app_config_recyclarr_x265_min_size: 4
# File size in MB per minute of video; releases above the max are skipped.
# 15 is ~375 MB per 25-minute episode or ~1.8 GB per 2-hour movie; 50 is ~1.25 GB or ~6 GB,
# room for 1080p WEB-DLs from streaming services (often 45 MB per minute).
app_config_recyclarr_preferred_size: 15
app_config_recyclarr_max_size:
  720p: 30
  1080p: 50

# SuggestArr's TMDb key (required for it), Simkl app and OMDb key (IMDb ratings), from the vault.
app_config_tmdb_api_key: "{{ vault_tmdb_api_key | default('') }}"
app_config_simkl_client_id: "{{ vault_simkl_client_id | default('') }}"
app_config_omdb_api_key: "{{ vault_omdb_api_key | default('') }}"
# SuggestArr's filters (optional app, homelab_suggestarr): a TMDb score of 60+ with 200+ votes,
# with an OMDb key also IMDb 7.0+ with 1000+ votes, nothing you have or requested, and every
# suggestion waits for your approval.
# The Jellyfin user whose watching your suggestions follow.
app_config_suggestarr_jellyfin_user: "{{ homelab_username }}"
app_config_suggestarr_settings:
  FILTER_TMDB_THRESHOLD: 60
  FILTER_TMDB_MIN_VOTES: 200
  FILTER_IMDB_THRESHOLD: 70
  FILTER_IMDB_MIN_VOTES: 1000
  FILTER_INCLUDE_NO_RATING: false
  EXCLUDE_DOWNLOADED: true
  EXCLUDE_REQUESTED: true
  REQUIRE_REQUEST_APPROVAL: true
