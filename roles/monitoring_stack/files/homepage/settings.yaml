---
# https://gethomepage.dev/configs/settings/
title: Homelab
theme: dark
color: slate
# Dark flowing lines (jonakoh, Unsplash), dimmed so the cards stay readable; the cards blur what is
# behind them.
background:
  image: https://images.unsplash.com/photo-1756093035138-7135b07084b5?auto=format&fit=crop&w=2560&q=80
  opacity: 60
cardBlur: md
headerStyle: boxedWidgets
# A dot per app: green when its web UI answers (siteMonitor in services.yaml).
statusStyle: dot
# A tab per group, every tile the same size.
useEqualHeights: true
layout:
  Media: { tab: Media, style: row, columns: 4 }
  Downloads: { tab: Downloads, style: row, columns: 4 }
  System: { tab: System, style: row, columns: 4 }
  # The accounts, by what they are for (app_config, homepage.yml), a column each.
  Network: { tab: Accounts }
  Control: { tab: Accounts }
  Suggestions: { tab: Accounts }
  Subtitles: { tab: Accounts }
  Backup: { tab: Accounts }
  Other: { tab: Accounts }
