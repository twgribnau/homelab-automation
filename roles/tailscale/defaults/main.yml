---
# Optional: your tailnet reaches this server on its LAN address too (a subnet route of just that
# one address, a /32). Then one address, e.g. http://<LAN address>:8096 for Jellyfin, works at
# home without Tailscale and away with it, and a Chromecast at home can play from it. Approve the
# route once in the Tailscale admin console (README, One Jellyfin address).
tailscale_lan_route: false
