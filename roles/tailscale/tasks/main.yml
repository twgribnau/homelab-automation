---
# Tailscale itself is installed and logged in by ./setup.sh (or by hand).

# Security fixes. The upgrade restarts tailscaled, so connections over Tailscale stall for a
# few seconds; the playbook itself runs locally and is not affected.
- name: Keep Tailscale up to date
  ansible.builtin.apt:
    name: tailscale
    state: latest
    only_upgrade: true
    update_cache: true
    cache_valid_time: 3600

# Your tailnet reaches the server on its LAN address (a subnet route of just that one address),
# so http://<LAN address>:<port> works at home without Tailscale and away with it.

# Subnet routing needs IP forwarding; Docker turns it on as well, this keeps it on after a reboot.
- name: Keep IP forwarding on
  ansible.builtin.copy:
    content: "net.ipv4.ip_forward = 1\n"
    dest: /etc/sysctl.d/99-tailscale.conf
    mode: "0644"
  notify: Apply IP forwarding

- name: Read the Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: _tailscale_prefs
  changed_when: false
  check_mode: false

# --advertise-routes replaces the whole list, so the routes already advertised are passed along.
# An exit node shows up as 0.0.0.0/0 and ::/0; tailscale keeps that setting by itself.
- name: Route the LAN address over Tailscale
  vars:
    _routes: >-
      {{ (_tailscale_prefs.stdout | from_json).AdvertiseRoutes | default([], true)
         | reject('in', ['0.0.0.0/0', '::/0']) | list }}
    _route: "{{ homelab_lan_ip }}/32"
  ansible.builtin.command: tailscale set --advertise-routes={{ _routes | union([_route]) | join(',') }}
  when: _route not in _routes
  changed_when: true
